[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    # 1-day cache + must-revalidate so site fixes propagate within a day.
    # `immutable` would lock browsers to old buggy code for up to a year.
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    # 1-day max-age + must-revalidate so updated photos propagate within a day.
    # `immutable` is intentionally NOT set — without that, browsers can revalidate
    # via etag when the file content changes (e.g., re-cropping or replacing a hero).
    Cache-Control = "public, max-age=86400, must-revalidate"

# Path redirects live in the `_redirects` file (single source of truth).
